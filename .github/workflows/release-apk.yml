name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Extract App Version
        id: version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F '"' '{print $2}')
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | tr -dc '0-9')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.5.0"; fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_TAG=v$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "=== Azonosított verzió: $VERSION_NAME (kód: $VERSION_CODE) ==="

      - name: Deploy Permanent Keystore and Environment
        run: |
          echo "" | base64 --decode > debug.keystore
          touch .env
          chmod +x gradlew
          ls -la debug.keystore
          echo "Allando kulcs sikeresen beallitva."

      - name: Build Debug APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          VERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}"
          cp app/build/outputs/apk/debug/app-debug.apk release-output/tetmester-pro-latest.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-output/tetmester-pro-v${VERSION_NAME}.apk
          ls -la release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetmester-pro-apk
          path: release-output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: |
            release-output/tetmester-pro-latest.apk
            release-output/tetmester-pro-v${{ steps.version.outputs.VERSION_NAME }}.apk
          tag_name: ${{ steps.version.outputs.VERSION_TAG }}
          name: TétMester Pro v${{ steps.version.outputs.VERSION_NAME }}
          make_latest: true
          body: |
            ### 🚀 TétMester Pro v${{ steps.version.outputs.VERSION_NAME }} Frissítés
            - **Automatikus verzió léptetés és külön Release bejegyzés (v${{ steps.version.outputs.VERSION_NAME }})**
            - **Egyetlen közös oldalon a Kalkulátor és a Telegram meccsek kézi odds alapú tétkezelése**
            - **Telegram Értesítés Feldolgozó (ganrax Alerts üzenetekből meccsek, csapatok és stratégiák kinyerése)**
            - **Automatikus kattintható Google & Flashscore kereső linkek minden meccshez**
            - **Állandó beépített kulcs (Permanent Keystore)** - garantáltan egyező aláírás minden verziónál!
            - **Android 14 (API 34) natív optimalizáció**
            - **100 Napos Kamatos Kamat Tétkezelő (Tőke / 49.25)**
            - **Élő Mérkőzéskövető és AI meccselemző**
          draft: false
          prerelease: false
