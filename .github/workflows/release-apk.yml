name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/tetmester-pro-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetmester-pro-apk
          path: release-output/tetmester-pro-latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-output/tetmester-pro-latest.apk
          tag_name: ${{ github.ref_name || 'latest' }}
          name: TétMester Pro ${{ github.ref_name || 'Latest' }}
          body: |
            ### TétMester Pro - Frissítés
            - 100 Napos Kamatos Kamat Tétkezelő
            - Automatikus tőkearányos tétlépcső (Tőke / 49.25)
            - 4-körös és Kármentés tétkalkuláció
            - Élő mérkőzéskövető és AI meccselemző
            - Alkalmazáson belüli egykattintásos frissítő
          draft: false
          prerelease: false
