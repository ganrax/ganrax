name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Verify Permanent Keystore and Environment
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          test -f debug.keystore || { echo "HIBA: Állandó debug.keystore nem található!"; exit 1; }
          touch .env
          chmod +x gradlew
          echo "Állandó hitelesítő kulcs (Permanent Keystore) ellenőrizve és készen áll."

      - name: Build Debug APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/tetmester-pro-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetmester-pro-apk
          path: release-output/tetmester-pro-latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: release-output/tetmester-pro-latest.apk
          tag_name: latest
          name: TétMester Pro (Legfrissebb Kiadás)
          body: |
            ###  TétMester Pro - Frissítés
            - **Állandó aláírókulcs (Permanent Keystore) használata** - nincs aláírás-ütközés a jövőbeli frissítéseknél!
            - **100 Napos Kamatos Kamat Tétkezelő**
            - **Automatikus tőkearányos tétnövekedés (Tőke / 49.25)**
            - **Többkörös & Kármentés Tétkalkulátor**
            - **Élő Mérkőzéskövető és AI meccselemző**
            - **Alkalmazáson belüli egykattintásos frissítő**

            *Telepítéshez töltsd le a lenti `tetmester-pro-latest.apk` fájlt.*
          draft: false
          prerelease: false
